<!DOCTYPE html>
<html lang="pt-BR" class="h-full bg-slate-50">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>VetExames - Financeiro</title>
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="VetExames">
    <link rel="apple-touch-icon" href="Prancheta 4.png">
    <link rel="icon" type="image/png" href="Prancheta 4.png">
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: {
                            teal: '#1F5B5C',
                            tealDark: '#153E3F',
                            tealLight: '#E8F2F2',
                            peach: '#F09B83',
                            peachDark: '#D97E66',
                            peachLight: '#FDF0EC',
                            bg: '#FAF9F6'
                        }
                    },
                    fontFamily: { sans: ['Inter', 'sans-serif'] }
                }
            }
        }
    </script>
</head>
<body class="bg-brand-bg text-slate-800 antialiased min-h-full flex flex-col pb-12">

    <!-- HEADER SUPERIOR -->
    <header class="bg-white border-b border-slate-200/80 sticky top-0 z-30 shadow-sm">
        <div class="max-w-md mx-auto md:max-w-2xl px-4 py-3 flex items-center justify-between">
            <a href="index.html" class="w-9 h-9 rounded-full bg-slate-100 flex items-center justify-center text-slate-600 hover:bg-slate-200 transition">
                <i class="fa-solid fa-arrow-left"></i>
            </a>
            <div class="text-center">
                <h1 class="font-bold text-base text-slate-800">Financeiro</h1>
                <p class="text-[11px] text-slate-500">Dashboard de Faturamento e Clínicas</p>
            </div>
            <div class="w-9 h-9 rounded-xl bg-brand-tealLight flex items-center justify-center p-1 border border-brand-teal/10 shadow-sm overflow-hidden">
                <img src="Prancheta 4.png" alt="VetExames Logo" class="w-full h-full object-contain" onerror="this.onerror=null; this.parentElement.innerHTML='<i class=\'fa-solid fa-paw text-brand-teal text-xl\'></i>';">
            </div>
        </div>
    </header>

    <main class="max-w-md mx-auto md:max-w-2xl px-4 pt-4 flex-1 w-full space-y-4">
        
        <!-- SEGMENTED CONTROL / BOTÕES DE ALTERNÂNCIA DE VISÃO -->
        <div class="bg-white p-3 rounded-2xl border border-slate-200 shadow-sm space-y-3">
            <div class="flex items-center justify-between gap-2">
                <span class="text-xs font-bold text-slate-700 uppercase tracking-wider flex items-center gap-1.5">
                    <i class="fa-solid fa-sliders text-brand-teal"></i> Visão Financeira:
                </span>
                <div class="inline-flex p-1 bg-slate-100 rounded-xl border border-slate-200/70">
                    <button type="button" id="btn-visao-mensal" onclick="setVisao('mensal')" class="px-4 py-1.5 text-xs font-bold rounded-lg transition-all duration-200 bg-brand-teal text-white shadow-sm">
                        Mensal
                    </button>
                    <button type="button" id="btn-visao-anual" onclick="setVisao('anual')" class="px-4 py-1.5 text-xs font-bold rounded-lg transition-all duration-200 text-slate-600 hover:text-slate-900">
                        Anual
                    </button>
                </div>
            </div>

            <!-- SELETOR DE MÊS (EXIBIDO APENAS NA VISÃO MENSAL) -->
            <div id="box-select-mes" class="flex items-center justify-between gap-2 pt-2 border-t border-slate-100">
                <label for="select-mes" class="text-xs font-semibold text-slate-600 flex items-center gap-1.5">
                    <i class="fa-solid fa-calendar-days text-brand-teal"></i> Mês Selecionado:
                </label>
                <select id="select-mes" onchange="processarDashboard()" class="px-3 py-1.5 text-xs font-semibold rounded-xl border border-slate-200 bg-slate-50 focus:outline-none focus:border-brand-teal text-slate-700">
                    <!-- Preenchido dinamicamente via JS -->
                </select>
            </div>
        </div>

        <!-- CARDS DE MENSURAÇÃO -->
        <div class="grid grid-cols-2 gap-3">
            <div class="bg-white p-4 rounded-2xl border border-slate-200 shadow-sm col-span-2 flex items-center justify-between">
                <div>
                    <span id="lbl-total" class="text-[10px] text-slate-400 font-bold uppercase block tracking-wider">Faturamento Total</span>
                    <span id="txt-total" class="text-2xl font-black text-slate-800">R$ 0,00</span>
                </div>
                <div class="w-10 h-10 rounded-xl bg-brand-tealLight text-brand-teal flex items-center justify-center text-lg shadow-sm">
                    <i class="fa-solid fa-sack-dollar"></i>
                </div>
            </div>

            <div class="bg-emerald-50/80 p-3.5 rounded-2xl border border-emerald-200/80 shadow-sm">
                <span class="text-[10px] text-emerald-600 font-bold uppercase block tracking-wider">Recebido (Pago)</span>
                <span id="txt-pago" class="text-lg font-black text-emerald-800">R$ 0,00</span>
            </div>

            <div class="bg-amber-50/80 p-3.5 rounded-2xl border border-amber-200/80 shadow-sm">
                <span class="text-[10px] text-amber-600 font-bold uppercase block tracking-wider">Pendente</span>
                <span id="txt-pendente" class="text-lg font-black text-amber-800">R$ 0,00</span>
            </div>
        </div>

        <!-- RESUMO POR CLÍNICA -->
        <div class="bg-white p-4 rounded-2xl border border-slate-200/90 shadow-sm space-y-3">
            <h3 class="font-bold text-xs text-slate-800 uppercase tracking-wider flex items-center gap-1.5">
                <i class="fa-solid fa-hospital text-brand-teal"></i> Faturamento por Clínica
            </h3>
            <div id="resumo-clinicas" class="space-y-2 text-xs">
                <p class="text-slate-400 text-center py-3">Carregando clínicas...</p>
            </div>
        </div>

        <!-- RESUMO POR TIPO DE EXAME -->
        <div class="bg-white p-4 rounded-2xl border border-slate-200/90 shadow-sm space-y-3">
            <h3 class="font-bold text-xs text-slate-800 uppercase tracking-wider flex items-center gap-1.5">
                <i class="fa-solid fa-chart-pie text-brand-teal"></i> Por Tipo de Exame
            </h3>
            <div id="resumo-tipos" class="space-y-2 text-xs">
                <p class="text-slate-400 text-center py-3">Carregando exames...</p>
            </div>
        </div>

    </main>

    <script>
        const GOOGLE_APP_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxaOy6vRmz_rU6OYTJ46YrPsq4-NpPQ_sromqDMA7jKZWpij1lkiSc5jQGvDr6G20k/exec";

        let cacheExames = [];
        let visaoAtual = 'mensal'; // Default: 'mensal' ou 'anual'

        // Limpa e converte strings monetárias/números para float
        function limparValor(val) {
            if (!val) return 0;
            if (typeof val === 'number') return val;
            let limpo = val.toString().replace(/[^\d,.-]/g, '');
            if (limpo.includes(',') && limpo.includes('.')) {
                limpo = limpo.replace(/\./g, '').replace(',', '.');
            } else if (limpo.includes(',')) {
                limpo = limpo.replace(',', '.');
            }
            const num = parseFloat(limpo);
            return isNaN(num) ? 0 : num;
        }

        // Formata número em Moeda Real (BRL)
        function formatarMoeda(val) {
            return val.toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });
        }

        // Popula as opções do seletor dos últimos 6 meses
        function gerarUltimosMeses() {
            const select = document.getElementById('select-mes');
            select.innerHTML = '';
            
            const dataAtual = new Date();
            for (let i = 0; i < 6; i++) {
                const d = new Date(dataAtual.getFullYear(), dataAtual.getMonth() - i, 1);
                const ano = d.getFullYear();
                const mes = String(d.getMonth() + 1).padStart(2, '0');
                const valorChave = `${ano}-${mes}`;
                
                const nomeMes = d.toLocaleString('pt-BR', { month: 'long', year: 'numeric' });
                const nomeFormatado = nomeMes.charAt(0).toUpperCase() + nomeMes.slice(1);

                const opt = document.createElement('option');
                opt.value = valorChave;
                opt.textContent = nomeFormatado;
                select.appendChild(opt);
            }
        }

        // Altera entre a visão Mensal e Anual atualizando visualmente os botões
        function setVisao(tipo) {
            visaoAtual = tipo;
            const btnMensal = document.getElementById('btn-visao-mensal');
            const btnAnual = document.getElementById('btn-visao-anual');
            const boxMes = document.getElementById('box-select-mes');

            if (tipo === 'mensal') {
                btnMensal.className = "px-4 py-1.5 text-xs font-bold rounded-lg transition-all duration-200 bg-brand-teal text-white shadow-sm";
                btnAnual.className = "px-4 py-1.5 text-xs font-bold rounded-lg transition-all duration-200 text-slate-600 hover:text-slate-900";
                boxMes.classList.remove('hidden');
            } else {
                btnAnual.className = "px-4 py-1.5 text-xs font-bold rounded-lg transition-all duration-200 bg-brand-teal text-white shadow-sm";
                btnMensal.className = "px-4 py-1.5 text-xs font-bold rounded-lg transition-all duration-200 text-slate-600 hover:text-slate-900";
                boxMes.classList.add('hidden');
            }

            processarDashboard();
        }

        // Inicialização
        window.addEventListener('DOMContentLoaded', async () => {
            gerarUltimosMeses();
            try {
                const res = await fetch(GOOGLE_APP_SCRIPT_URL);
                cacheExames = await res.json();
                processarDashboard();
            } catch (err) {
                console.error("Erro ao carregar dados financeiros:", err);
                document.getElementById('resumo-clinicas').innerHTML = '<p class="text-rose-500 text-center py-2 font-medium">Falha ao carregar dados.</p>';
                document.getElementById('resumo-tipos').innerHTML = '<p class="text-rose-500 text-center py-2 font-medium">Falha ao carregar dados.</p>';
            }
        });

        // Calcula e renderiza todos os dados do Dashboard
        function processarDashboard() {
            const anoAtual = new Date().getFullYear().toString();
            const mesSelecionado = document.getElementById('select-mes').value; // Formato "YYYY-MM"

            let total = 0;
            let pago = 0;
            let pendente = 0;
            const porTipo = {};
            const porClinica = {};

            // Atualiza o rótulo do card principal
            document.getElementById('lbl-total').innerText = visaoAtual === 'anual' 
                ? `Faturamento Total de ${anoAtual} (Ano)` 
                : 'Faturamento Total do Mês';

            cacheExames.forEach(item => {
                const dataExame = (item.dataExame || '').toString().trim();

                // Filtragem por visão selecionada
                if (visaoAtual === 'anual') {
                    if (!dataExame.startsWith(anoAtual)) return;
                } else {
                    if (!dataExame.startsWith(mesSelecionado)) return;
                }

                const v1 = limparValor(item.valor);
                const v2 = limparValor(item.valor2);
                const v3 = limparValor(item.valor3);
                const valorAtendimento = v1 + v2 + v3;

                const status = (item.statusPagamento || '').toString().trim().toUpperCase();
                const clinica = (item.clinica || 'Particular / Sem Clínica').trim();

                total += valorAtendimento;
                if (status === 'PAGO') pago += valorAtendimento;
                else pendente += valorAtendimento;

                // Agrupamento por Clínica
                if (!porClinica[clinica]) porClinica[clinica] = { qtd: 0, valor: 0 };
                porClinica[clinica].qtd++;
                porClinica[clinica].valor += valorAtendimento;

                // Agrupamento por Tipo de Exame
                const tiposDesteAtendimento = [item.tipoExame, item.tipoExame2, item.tipoExame3];
                tiposDesteAtendimento.forEach((t, idx) => {
                    if (t && t.trim() !== "") {
                        const nomeTipo = t.trim();
                        let valExame = idx === 0 ? v1 : (idx === 1 ? v2 : v3);
                        if (valExame === 0 && valorAtendimento > 0 && idx === 0) valExame = valorAtendimento;

                        if (!porTipo[nomeTipo]) porTipo[nomeTipo] = { qtd: 0, valor: 0 };
                        porTipo[nomeTipo].qtd++;
                        porTipo[nomeTipo].valor += valExame;
                    }
                });
            });

            // Atualiza os Cards de Valores
            document.getElementById('txt-total').innerText = formatarMoeda(total);
            document.getElementById('txt-pago').innerText = formatarMoeda(pago);
            document.getElementById('txt-pendente').innerText = formatarMoeda(pendente);

            // Renderiza Lista por Clínica
            const containerClinicas = document.getElementById('resumo-clinicas');
            const clinicasArr = Object.entries(porClinica);
            if (!clinicasArr.length) {
                containerClinicas.innerHTML = `<p class="text-slate-400 text-center py-2">Nenhum registro encontrado para a visão ${visaoAtual}.</p>`;
            } else {
                containerClinicas.innerHTML = clinicasArr.map(([nome, d]) => `
                    <div class="flex items-center justify-between p-2.5 rounded-xl bg-slate-50 border border-slate-100 hover:border-slate-200 transition-colors">
                        <div>
                            <span class="font-bold text-slate-800 block">${nome}</span>
                            <span class="text-[10px] text-slate-400">${d.qtd} ${d.qtd === 1 ? 'atendimento' : 'atendimentos'}</span>
                        </div>
                        <span class="font-extrabold text-slate-700">${formatarMoeda(d.valor)}</span>
                    </div>
                `).join('');
            }

            // Renderiza Lista por Tipo de Exame
            const containerTipos = document.getElementById('resumo-tipos');
            const tiposArr = Object.entries(porTipo);
            if (!tiposArr.length) {
                containerTipos.innerHTML = `<p class="text-slate-400 text-center py-2">Nenhum exame encontrado para a visão ${visaoAtual}.</p>`;
            } else {
                containerTipos.innerHTML = tiposArr.map(([nome, d]) => `
                    <div class="flex items-center justify-between p-2.5 rounded-xl bg-slate-50 border border-slate-100 hover:border-slate-200 transition-colors">
                        <div>
                            <span class="font-bold text-slate-800 block">${nome}</span>
                            <span class="text-[10px] text-slate-400">${d.qtd} ${d.qtd === 1 ? 'realizado' : 'realizados'}</span>
                        </div>
                        <span class="font-extrabold text-slate-700">${formatarMoeda(d.valor)}</span>
                    </div>
                `).join('');
            }
        }
    </script>
</body>
</html>
