<!DOCTYPE html>
<html lang="pt-BR" class="h-full bg-slate-50">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>VetExames - Financeiro</title>
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="VetExames">
    <link rel="apple-touch-icon" href="Prancheta 4.png">
    <link rel="icon" type="image/png" href="Prancheta 4.png">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: {
                            teal: '#1F5B5C',
                            tealDark: '#153E3F',
                            tealLight: '#E8F2F2',
                            peach: '#F09B83',
                            peachDark: '#D97E66',
                            peachLight: '#FDF0EC',
                            bg: '#FAF9F6'
                        }
                    },
                    fontFamily: { sans: ['Inter', 'sans-serif'] }
                }
            }
        }
    </script>
</head>
<body class="bg-brand-bg text-slate-800 antialiased h-full flex flex-col pb-28 md:pb-20">

    <header class="bg-white border-b border-slate-200/80 sticky top-0 z-30 shadow-sm">
        <div class="max-w-md mx-auto md:max-w-2xl px-4 py-3 flex items-center justify-between">
            <a href="index.html" class="w-9 h-9 rounded-full bg-slate-100 flex items-center justify-center text-slate-600 hover:bg-slate-200 transition">
                <i class="fa-solid fa-arrow-left"></i>
            </a>
            <div class="text-center">
                <h1 class="font-bold text-base text-slate-800">Financeiro</h1>
                <p class="text-[11px] text-slate-500">Resumo de Faturamento e Recebimentos</p>
            </div>
            <div class="w-9 h-9 rounded-xl bg-brand-tealLight flex items-center justify-center p-1 border border-brand-teal/10 shadow-sm overflow-hidden">
                <img src="Prancheta 4.png" alt="VetExames Logo" class="w-full h-full object-contain" onerror="this.onerror=null; this.parentElement.innerHTML='<i class=\'fa-solid fa-paw text-brand-teal text-xl\'></i>';">
            </div>
        </div>
    </header>

    <main class="max-w-md mx-auto md:max-w-2xl px-4 pt-4 flex-1 w-full space-y-4">
        
        <!-- CARDS MENSURAÇÃO -->
        <div class="grid grid-cols-2 gap-3">
            <div class="bg-white p-4 rounded-2xl border border-slate-200 shadow-sm col-span-2 flex items-center justify-between">
                <div>
                    <span class="text-[10px] text-slate-400 font-bold uppercase block">Faturamento Total</span>
                    <span id="txt-total" class="text-2xl font-black text-slate-800">R$ 0,00</span>
                </div>
                <div class="w-10 h-10 rounded-xl bg-brand-tealLight text-brand-teal flex items-center justify-center text-lg">
                    <i class="fa-solid fa-sack-dollar"></i>
                </div>
            </div>

            <div class="bg-emerald-50/80 p-3.5 rounded-2xl border border-emerald-200/80">
                <span class="text-[10px] text-emerald-600 font-bold uppercase block">Recebido (Pago)</span>
                <span id="txt-pago" class="text-lg font-black text-emerald-800">R$ 0,00</span>
            </div>

            <div class="bg-amber-50/80 p-3.5 rounded-2xl border border-amber-200/80">
                <span class="text-[10px] text-amber-600 font-bold uppercase block">Pendente</span>
                <span id="txt-pendente" class="text-lg font-black text-amber-800">R$ 0,00</span>
            </div>
        </div>

        <!-- RESUMO POR TIPO -->
        <div class="bg-white p-4 rounded-2xl border border-slate-200/90 shadow-sm space-y-3">
            <h3 class="font-bold text-xs text-slate-800 uppercase tracking-wider flex items-center gap-1.5">
                <i class="fa-solid fa-chart-pie text-brand-teal"></i> Por Tipo de Exame
            </h3>
            <div id="resumo-tipos" class="space-y-2 text-xs">
                <p class="text-slate-400 text-center py-4">Calculando totais...</p>
            </div>
        </div>

    </main>

    <nav class="fixed bottom-0 left-0 right-0 bg-white border-t border-slate-200/90 py-2 px-4 z-40 md:max-w-2xl md:mx-auto md:rounded-t-2xl md:shadow-lg">
        <div class="flex justify-around items-center max-w-md mx-auto">
            <a href="index.html" class="flex flex-col items-center text-slate-400 hover:text-brand-teal transition">
                <i class="fa-solid fa-house text-lg"></i>
                <span class="text-[10px] mt-0.5">Início</span>
            </a>
            <a href="exames.html" class="flex flex-col items-center text-slate-400 hover:text-brand-teal transition">
                <i class="fa-solid fa-notes-medical text-lg"></i>
                <span class="text-[10px] mt-0.5">Exames</span>
            </a>
            <a href="cadastro_exame.html" class="w-12 h-12 rounded-full bg-brand-teal text-white flex items-center justify-center text-xl shadow-lg hover:bg-brand-tealDark transition -mt-5 ring-4 ring-slate-50">
                <i class="fa-solid fa-plus"></i>
            </a>
            <a href="pacientes.html" class="flex flex-col items-center text-slate-400 hover:text-brand-teal transition">
                <i class="fa-solid fa-paw text-lg"></i>
                <span class="text-[10px] mt-0.5">Pacientes</span>
            </a>
            <a href="financeiro.html" class="flex flex-col items-center text-brand-teal font-bold transition">
                <i class="fa-solid fa-chart-line text-lg"></i>
                <span class="text-[10px] mt-0.5">Financeiro</span>
            </a>
        </div>
    </nav>

    <script>
        const GOOGLE_APP_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxaOy6vRmz_rU6OYTJ46YrPsq4-NpPQ_sromqDMA7jKZWpij1lkiSc5jQGvDr6G20k/exec";

        function limparValor(val) {
            if (!val) return 0;
            if (typeof val === 'number') return val;
            const num = val.toString().replace(/[^\d,-]/g, '').replace(',', '.');
            return parseFloat(num) || 0;
        }

        function formatarMoeda(val) {
            return val.toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });
        }

        window.addEventListener('DOMContentLoaded', async () => {
            try {
                const res = await fetch(GOOGLE_APP_SCRIPT_URL);
                const exames = await res.json();

                let total = 0;
                let pago = 0;
                let pendente = 0;
                const porTipo = {};

                exames.forEach(item => {
                    const v = limparValor(item.valor);
                    const status = (item.statusPagamento || '').toString().trim().toUpperCase();
                    const tipo = (item.tipoExame || 'Outros').trim();

                    total += v;
                    if (status === 'PAGO') pago += v;
                    else pendente += v;

                    if (!porTipo[tipo]) porTipo[tipo] = { qtd: 0, valor: 0 };
                    porTipo[tipo].qtd++;
                    porTipo[tipo].valor += v;
                });

                document.getElementById('txt-total').innerText = formatarMoeda(total);
                document.getElementById('txt-pago').innerText = formatarMoeda(pago);
                document.getElementById('txt-pendente').innerText = formatarMoeda(pendente);

                const containerTipos = document.getElementById('resumo-tipos');
                const tiposArr = Object.entries(porTipo);

                if (!tiposArr.length) {
                    containerTipos.innerHTML = '<p class="text-slate-400 text-center">Nenhum dado financeiro encontrado.</p>';
                    return;
                }

                containerTipos.innerHTML = tiposArr.map(([nome, d]) => `
                    <div class="flex items-center justify-between p-2.5 rounded-xl bg-slate-50 border border-slate-100">
                        <div>
                            <span class="font-bold text-slate-800 block">${nome}</span>
                            <span class="text-[10px] text-slate-400">${d.qtd} ${d.qtd === 1 ? 'realizado' : 'realizados'}</span>
                        </div>
                        <span class="font-extrabold text-slate-700">${formatarMoeda(d.valor)}</span>
                    </div>
                `).join('');

            } catch (err) {
                console.error(err);
            }
        });
    </script>
</body>
</html>
