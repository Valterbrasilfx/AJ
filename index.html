:var(--text);font-size:12px;min-width:190px;outline:none}.search-input:focus,input:focus,select:focus,textarea:focus{border-color:var(--teal-2);box-shadow:0 0 0 3px #2d6b6a15;outline:none}.toolbar{display:flex;justify-content:space-between;gap:12px;align-items:center;margin-bottom:17px;flex-wrap:wrap}.toolbar-left,.toolbar-right{display:flex;gap:9px;align-items:center;flex-wrap:wrap}.empty-state{text-align:center;padding:36px 15px;color:var(--muted);font-size:12px}.empty-state b{display:block;font-size:14px;color:var(--text);margin-bottom:7px}.report-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}.report-card{padding:21px}.report-card .stat-value{font-size:25px}.bar-list{display:grid;gap:16px;margin-top:22px}.bar-row{display:grid;grid-template-columns:100px 1fr 30px;align-items:center;gap:10px;font-size:11px}.bar-track{height:8px;background:var(--surface-2);border-radius:20px;overflow:hidden}.bar-fill{height:100%;background:var(--teal-2);border-radius:20px}.bar-row:nth-child(2) .bar-fill{background:var(--coral)}.bar-row:nth-child(3) .bar-fill{background:#88b4a5}.finance-total{background:var(--teal);color:white;border-radius:15px;padding:23px;margin-bottom:18px;display:flex;justify-content:space-between;align-items:center;gap:20px}.finance-total small{opacity:.75;font-size:11px}.finance-total strong{display:block;font:800 27px Manrope,sans-serif;margin-top:8px}.finance-total .finance-note{font-size:11px;opacity:.75}.form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:15px}.field{display:flex;flex-direction:column;gap:7px;min-width:0}.field.full{grid-column:1/-1}.field label{font-size:11px;font-weight:700;color:var(--muted)}.field input,.field select,.field textarea{width:100%;background:var(--surface);border:1px solid var(--border);border-radius:9px;padding:11px 12px;color:var(--text);font-size:12px;min-width:0}.field textarea{resize:vertical;min-height:75px}.modal-head{display:flex;justify-content:space-between;align-it   <title>Clínica — Gestão de exames</title>
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar" id="sidebar">
      <div class="brand"><div class="brand-mark">✚</div><div><strong>Clínica</strong><small>GESTÃO DE EXAMES</small></div></div>
      <div class="side-label">MENU PRINCIPAL</div>
      <nav class="nav-list" aria-label="Menu principal">
        <button class="nav-item active" data-page="inicio"><span class="nav-icon">⌂</span>Início</button>
        <button class="nav-item" data-page="cadastro"><span class="nav-icon">＋</span>Cadastro de exames</button>
        <button class="nav-item" data-page="exames"><span class="nav-icon">▤</span>Exames</button>
        <button class="nav-item" data-page="pacientes"><span class="nav-icon">♙</span>Pacientes</button>
        <button class="nav-item" data-page="financeiro"><span class="nav-icon">＄</span>Financeiro</button>
        <button class="nav-item" data-page="relatorios"><span class="nav-icon">▥</span>Relatórios</button>
      </nav>
      <div class="sidebar-bottom"><div class="help-card"><span class="help-icon">♡</span><strong>Organize sua rotina</strong><p>Seus exames e cadastros em um só lugar.</p></div><div class="profile"><div class="avatar">VB</div><div><strong>Administrador</strong><small>Painel de gestão</small></div><span class="profile-dot"></span></div></div>
    </aside>
    <main class="main-area">
      <header class="topbar"><button class="icon-btn mobile-menu" id="menuBtn" aria-label="Abrir menu">☰</button><div class="breadcrumb">Painel <span>/</span> <strong id="crumb">Início</strong></div><div class="top-actions"><span class="today" id="today"></span><button class="theme-toggle" id="themeToggle" aria-label="Alternar tons claros e escuros"><span id="themeIcon">☼</span><span id="themeLabel">Tons claros</span><span class="toggle-track"><i></i></span></button></div></header>
      <div class="content" id="content"></div>
      <footer>Gestão de exames <span>•</span> Protótipo web responsivo</footer>
    </main>
  </div>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <dialog id="modal"><form id="modalForm" method="dialog"><div class="modal-head"><div><span class="eyebrow" id="modalEyebrow">NOVO REGISTRO</span><h2 id="modalTitle">Adicionar registro</h2></div><button class="icon-btn" type="button" id="closeModal" aria-label="Fechar">×</button></div><div id="modalFields" class="form-grid"></div><div class="modal-actions"><button class="btn btn-secondary" type="button" id="cancelModal">Cancelar</button><button class="btn btn-primary" type="submit">Salvar registro</button></div></form></dialog>
  <script>
const $=s=>document.querySelector(s);const $$=s=>[...document.querySelectorAll(s)];
const store={read(k){try{return JSON.parse(localStorage.getItem('clinica_'+k))||[]}catch{return[]}},write(k,v){localStorage.setItem('clinica_'+k,JSON.stringify(v))}};
let patients=store.read('patients'), exams=store.read('exams'), finance=store.read('finance'), page='inicio', searchTerm='', modalType='';
const today=new Date();$('#today').textContent=today.toLocaleDateString('pt-BR',{weekday:'short',day:'2-digit',month:'short',year:'numeric'});
const money=n=>Number(n||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});const dateBR=s=>s?new Date(s+'T12:00:00').toLocaleDateString('pt-BR'):'—';const initials=n=>(n||'?').trim().split(/\s+/).slice(0,2).map(x=>x[0]).join('').toUpperCase();const escapeHTML=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const modules=[['cadastro','＋','Cadastro de exames','Registre novos atendimentos e exames.'],['exames','▤','Exames','Consulte e acompanhe os registros.'],['pacientes','♙','Pacientes','Mantenha os dados dos pacientes.'],['financeiro','＄','Financeiro','Entradas e controle financeiro.'],['relatorios','▥','Relatórios','Resumo da operação.']];
function setPage(p){page=p;searchTerm='';$$('.nav-item').forEach(b=>b.classList.toggle('active',b.dataset.page===p));$('#sidebar').classList.remove('open');render()}
$$('.nav-item').forEach(b=>b.addEventListener('click',()=>setPage(b.dataset.page)));$('#menuBtn').onclick=()=>$('#sidebar').classList.toggle('open');
$('#themeToggle').onclick=()=>{document.body.classList.toggle('dark');let dark=document.body.classList.contains('dark');$('#themeLabel').textContent=dark?'Tons escuros':'Tons claros';$('#themeIcon').textContent=dark?'☾':'☼';localStorage.setItem('clinica_theme',dark?'dark':'light')};if(localStorage.getItem('clinica_theme')==='dark'){$('#themeToggle').click()}
function heading(kicker,title,desc,actions=''){return `<div class="page-heading"><div><div class="eyebrow">${kicker}</div><h1>${title}</h1><p>${desc}</p></div><div class="heading-actions">${actions}</div></div>`}
function stat(label,value,icon,foot,coral=false){return `<div class="stat-card"><div class="stat-top"><span class="stat-label">${label}</span><span class="stat-icon ${coral?'coral':''}">${icon}</span></div><div class="stat-value">${value}</div><div class="stat-foot">${foot}</div></div>`}
function patientName(id){return patients.find(p=>p.id===id)?.name||'Paciente não informado'}
function statusBadge(s){let cls=s==='Concluído'?'':s==='Cancelado'?'cancelled':'pending';return `<span class="status ${cls}">${escapeHTML(s||'Pendente')}</span>`}
function table(headers,rows,empty='Nenhum registro por aqui ainda.'){return `<div class="table-wrap"><table class="data-table"><thead><tr>${headers.map(h=>`<th>${h}</th>`).join('')}</tr></thead><tbody>${rows||`<tr><td colspan="${headers.length}"><div class="empty-state"><b>${empty}</b>Adicione um registro para começar.</div></td></tr>`}</tbody></table></div>`}
function patientRows(list){return list.map(p=>`<tr><td><div class="patient-cell"><div class="patient-mini">${escapeHTML(initials(p.name))}</div><strong>${escapeHTML(p.name)}</strong></div></td><td>${escapeHTML(p.phone||'—')}</td><td>${escapeHTML(p.email||'—')}</td><td>${dateBR(p.birth)}</td><td><button class="text-link" data-edit-patient="${p.id}">Ver detalhes</button></td></tr>`).join('')}
function examRows(list){return list.map(e=>`<tr><td><strong>${escapeHTML(e.name)}</strong><div class="muted" style="font-size:10px;margin-top:4px">${escapeHTML(e.type||'Exame')}</div></td><td>${escapeHTML(patientName(e.patientId))}</td><td>${dateBR(e.date)}</td><td>${statusBadge(e.status)}</td><td>${money(e.price)}</td><td><button class="text-link" data-status="${e.id}">Atualizar</button></td></tr>`).join('')}
function financeRows(list){return list.map(f=>`<tr><td>${dateBR(f.date)}</td><td><strong>${escapeHTML(f.description)}</strong></td><td>${escapeHTML(f.category||'—')}</td><td>${f.kind==='Entrada'?'<span class="status">Entrada</span>':'<span class="status cancelled">Saída</span>'}</td><td><strong>${f.kind==='Entrada'?'+ ':'− '}${money(f.amount)}</strong></td></tr>`).join('')}
function render(){let names={inicio:'Início',cadastro:'Cadastro de exames',exames:'Exames',pacientes:'Pacientes',financeiro:'Financeiro',relatorios:'Relatórios'};$('#crumb').textContent=names[page]||'Início';let c=$('#content');if(page==='inicio')c.innerHTML=home();if(page==='cadastro')c.innerHTML=registerPage();if(page==='exames')c.innerHTML=examsPage();if(page==='pacientes')c.innerHTML=patientsPage();if(page==='financeiro')c.innerHTML=financePage();if(page==='relatorios')c.innerHTML=reportsPage();bindContent()}
function home(){let pending=exams.filter(e=>e.status!=='Concluído'&&e.status!=='Cancelado').length, revenue=finance.filter(f=>f.kind==='Entrada').reduce((a,f)=>a+ +f.amount,0),out=finance.filter(f=>f.kind==='Saída').reduce((a,f)=>a+ +f.amount,0);let recent=exams.slice().sort((a,b)=>(b.created||'').localeCompare(a.created||'')).slice(0,4).map(e=>`<div class="activity-row"><div class="activity-icon">▤</div><div class="activity-info"><strong>${escapeHTML(e.name)}</strong><small>${escapeHTML(patientName(e.patientId))} · ${dateBR(e.date)}</small></div>${statusBadge(e.status)}</div>`).join('');return `${heading('VISÃO GERAL','Bom dia!','Acompanhe os principais indicadores da sua rotina.','<button class="btn btn-primary" data-go="cadastro">＋ Novo exame</button>')}<div class="dashboard-grid"><section class="panel"><div class="panel-head"><div><h2>Acesso rápido</h2><p>Escolha uma área para continuar</p></div></div><div class="module-grid">${modules.map(m=>`<button class="module-card" data-go="${m[0]}"><span class="module-icon">${m[1]}</span><strong>${m[2]}</strong><small>${m[3]}</small></button>`).join('')}</div></section><section class="panel"><div class="panel-head"><div><h2>Exames recentes</h2><p>Últimos registros adicionados</p></div><button class="text-link" data-go="exames">Ver todos →</button></div><div class="activity-list">${recent||'<div class="empty-state"><b>Nenhum exame cadastrado</b>Seus registros recentes aparecerão aqui.</div>'}</div></section></div><section class="panel"><div class="panel-head"><div><h2>Pacientes recentes</h2><p>Visão rápida dos cadastros</p></div><button class="text-link" data-go="pacientes">Ver pacientes →</button></div>${table(['PACIENTE','TELEFONE','E-MAIL','NASCIMENTO',''],patientRows(patients.slice(-4).reverse()))}</section>`}
function registerPage(){return `${heading('ATENDIMENTO','Cadastro de exames','Registre um exame e associe-o a um paciente.')}<section class="panel"><div class="panel-head"><div><h2>Novo exame</h2><p>Preencha os campos abaixo para cadastrar o exame.</p></div><span class="status pending">Novo registro</span></div>${examForm()}</section><section class="panel" style="margin-top:18px"><div class="panel-head"><div><h2>Precisa cadastrar um paciente?</h2><p>Cadastre os dados antes de registrar o exame.</p></div><button class="btn btn-secondary" data-action="new-patient">＋ Novo paciente</button></div></section>`}
function examForm(){return `<form id="examInlineForm"><div class="form-grid">${field('Nome do exame','name','text','Ex.: Hemograma',true)}${field('Tipo / categoria','type','text','Ex.: Laboratorial')}${field('Paciente','patientId','select','',true,patients.map(p=>[p.id,p.name]))}${field('Data do exame','date','date','',true)}${field('Valor (R$)','price','number','0,00',false, null,'0.01')}${field('Status','status','select','',true,[['Pendente','Pendente'],['Em andamento','Em andamento'],['Concluído','Concluído'],['Cancelado','Cancelado']])}<div class="field full"><label>Observações</label><textarea name="notes" placeholder="Informações adicionais (opcional)"></textarea></div></div><div class="modal-actions"><button class="btn btn-primary" type="submit">Salvar exame</button></div></form>`}
function field(label,name,type,placeholder='',required=false,options=null,step=null){let control=type==='select'?`<select name="${name}" ${required?'required':''}><option value="">Selecione...</option>${(options||[]).map(o=>`<option value="${escapeHTML(o[0])}">${escapeHTML(o[1])}</option>`).join('')}</select>`:`<input name="${name}" type="${type}" placeholder="${placeholder}" ${required?'required':''} ${step?`step="${step}"`:''} ${type==='number'?'min="0"':''}>`;return `<div class="field"><label>${label}${required?' *':''}</label>${control}</div>`}
function patientsPage(){let list=patients.filter(p=>(p.name+' '+p.phone+' '+p.email).toLowerCase().includes(searchTerm.toLowerCase()));return `${heading('CADASTROS','Pacientes','Consulte e gerencie os pacientes cadastrados.','<button class="btn btn-primary" data-action="new-patient">＋ Novo paciente</button>')}<section class="panel"><div class="toolbar"><div><strong style="font:700 14px Manrope">Todos os pacientes</strong><div class="muted" style="font-size:11px;margin-top:5px">${patients.length} cadastro(s)</div></div><div class="toolbar-right"><input class="search-input" id="searchBox" placeholder="Buscar paciente..." value="${escapeHTML(searchTerm)}"></div></div>${table(['PACIENTE','TELEFONE','E-MAIL','NASCIMENTO','AÇÕES'],patientRows(list))}</section>`}
function examsPage(){let list=exams.filter(e=>(e.name+' '+patientName(e.patientId)+' '+e.status).toLowerCase().includes(searchTerm.toLowerCase()));return `${heading('ATENDIMENTOS','Exames','Consulte os registros e acompanhe o status.','<button class="btn btn-primary" data-go="cadastro">＋ Cadastrar exame</button>')}<section class="panel"><div class="toolbar"><div><strong style="font:700 14px Manrope">Todos os exames</strong><div class="muted" style="font-size:11px;margin-top:5px">${exams.length} registro(s)</div></div><div class="toolbar-right"><input class="search-input" id="searchBox" placeholder="Buscar exame ou paciente..." value="${escapeHTML(searchTerm)}"></div></div>${table(['EXAME','PACIENTE','DATA','STATUS','VALOR','AÇÕES'],examRows(list))}</section>`}
function financePage(){let incoming=finance.filter(f=>f.kind==='Entrada').reduce((a,f)=>a+ +f.amount,0),out=finance.filter(f=>f.kind==='Saída').reduce((a,f)=>a+ +f.amount,0);return `${heading('GESTÃO','Financeiro','Registre entradas e saídas para acompanhar o saldo.','<button class="btn btn-coral" data-action="new-finance">＋ Lançamento</button>')}<div class="finance-total"><div><small>Saldo total registrado</small><strong>${money(incoming-out)}</strong><div class="finance-note">Valores adicionados manualmente</div></div><div><small>Entradas</small><strong style="font-size:18px">${money(incoming)}</strong><small style="display:block;margin-top:12px">Saídas: ${money(out)}</small></div></div><section class="panel"><div class="panel-head"><div><h2>Movimentações</h2><p>${finance.length} lançamento(s) registrado(s)</p></div></div>${table(['DATA','DESCRIÇÃO','CATEGORIA','TIPO','VALOR'],financeRows(finance.slice().reverse()))}</section>`}
function reportsPage(){let done=exams.filter(e=>e.status==='Concluído').length,pending=exams.filter(e=>e.status==='Pendente'||e.status==='Em andamento').length,rev=finance.filter(f=>f.kind==='Entrada').reduce((a,f)=>a+ +f.amount,0),out=finance.filter(f=>f.kind==='Saída').reduce((a,f)=>a+ +f.amount,0),max=Math.max(done,pending,exams.length-done-pending,1);return `${heading('ACOMPANHAMENTO','Relatórios','Resumo dos registros cadastrados no sistema.','<button class="btn btn-secondary" data-action="export">⇩ Exportar CSV</button>')}<div class="report-grid">${stat('Pacientes',patients.length,'♙','Total de cadastros')}${stat('Exames concluídos',done,'✓','Registros concluídos',true)}${stat('Exames pendentes',pending,'◷','Aguardando andamento')}</div><div class="dashboard-grid" style="margin-top:18px"><section class="panel"><div class="panel-head"><div><h2>Status dos exames</h2><p>Distribuição dos registros atuais</p></div></div><div class="bar-list">${[['Concluídos',done],['Pendentes / andamento',pending],['Outros',exams.length-done-pending]].map(x=>`<div class="bar-row"><span>${x[0]}</span><div class="bar-track"><div class="bar-fill" style="width:${Math.round(x[1]/max*100)}%"></div></div><strong>${x[1]}</strong></div>`).join('')}</div></section><section class="panel"><div class="panel-head"><div><h2>Resumo financeiro</h2><p>Lançamentos registrados manualmente</p></div></div><div class="activity-list"><div class="activity-row"><div class="activity-icon">↗</div><div class="activity-info"><strong>Entradas</strong><small>Valores recebidos</small></div><strong>${money(rev)}</strong></div><div class="activity-row"><div class="activity-icon">↘</div><div class="activity-info"><strong>Saídas</strong><small>Valores pagos</small></div><strong>${money(out)}</strong></div><div class="activity-row"><div class="activity-icon">＝</div><div class="activity-info"><strong>Saldo</strong><small>Entradas − saídas</small></div><strong>${money(rev-out)}</strong></div></div></section></div>`}
function bindContent(){ $$('[data-go]').forEach(b=>b.onclick=()=>setPage(b.dataset.go));$$('[data-action="new-patient"]').forEach(b=>b.onclick=()=>openModal('patient'));$$('[data-action="new-finance"]').forEach(b=>b.onclick=()=>openModal('finance'));$('#searchBox')?.addEventListener('input',e=>{let pos=e.target.selectionStart;searchTerm=e.target.value;let old=page;render();let box=$('#searchBox');if(box){box.focus();box.setSelectionRange(pos,pos)}});$('#examInlineForm')?.addEventListener('submit',e=>{e.preventDefault();let d=Object.fromEntries(new FormData(e.target));if(!patients.some(p=>p.id===d.patientId)){toast('Cadastre um paciente antes de registrar o exame.');return}exams.push({...d,id:crypto.randomUUID(),created:new Date().toISOString(),price:Number(d.price||0)});store.write('exams',exams);toast('Exame cadastrado com sucesso!');setPage('exames')});$$('[data-status]').forEach(b=>b.onclick=()=>{let e=exams.find(x=>x.id===b.dataset.status);if(!e)return;let next=prompt('Novo status: Pendente, Em andamento, Concluído ou Cancelado',e.status);if(['Pendente','Em andamento','Concluído','Cancelado'].includes(next)){e.status=next;store.write('exams',exams);render();toast('Status atualizado.')}});$$('[data-edit-patient]').forEach(b=>b.onclick=()=>{let p=patients.find(x=>x.id===b.dataset.editPatient);alert(`Paciente: ${p.name}\nTelefone: ${p.phone||'—'}\nE-mail: ${p.email||'—'}\nNascimento: ${dateBR(p.birth)}\nObservações: ${p.notes||'—'}`)});$('#exportCsv')?.addEventListener('click',exportCSV);$$('[data-action="export"]').forEach(b=>b.onclick=exportCSV)}
function openModal(type){modalType=type;let fields=$('#modalFields');$('#modalTitle').textContent=type==='patient'?'Cadastrar paciente':'Novo lançamento financeiro';$('#modalEyebrow').textContent=type==='patient'?'DADOS DO PACIENTE':'MOVIMENTAÇÃO';if(type==='patient')fields.innerHTML=field('Nome completo','name','text','Nome do paciente',true)+field('Telefone','phone','tel','(00) 00000-0000')+field('E-mail','email','email','email@exemplo.com')+field('Data de nascimento','birth','date')+'<div class="field full"><label>Observações</label><textarea name="notes" placeholder="Informações adicionais (opcional)"></textarea></div>';else fields.innerHTML=field('Descrição','description','text','Ex.: Pagamento de exame',true)+field('Valor (R$)','amount','number','0,00',true,null,'0.01')+field('Tipo','kind','select','',true,[['Entrada','Entrada'],['Saída','Saída']])+field('Categoria','category','select','',false,[['Exames','Exames'],['Despesas','Despesas'],['Materiais','Materiais'],['Outros','Outros']])+field('Data','date','date','',true);$('#modal').showModal()}
$('#closeModal').onclick=$('#cancelModal').onclick=()=>$('#modal').close();$('#modalForm').addEventListener('submit',e=>{e.preventDefault();let d=Object.fromEntries(new FormData(e.target));if(modalType==='patient'){patients.push({...d,id:crypto.randomUUID(),created:new Date().toISOString()});store.write('patients',patients);$('#modal').close();toast('Paciente cadastrado com sucesso!');setPage('pacientes')}else{d.amount=Number(d.amount);finance.push({...d,id:crypto.randomUUID()});store.write('finance',finance);$('#modal').close();toast('Lançamento registrado!');setPage('financeiro')}});
function toast(s){let t=$('#toast');t.textContent=s;t.classList.add('show');clearTimeout(window.toastTimer);window.toastTimer=setTimeout(()=>t.classList.remove('show'),2800)}
function exportCSV(){let rows=[['Tipo','Nome/Descrição','Paciente/Categoria','Data','Status/Tipo','Valor']];patients.forEach(p=>rows.push(['Paciente',p.name,p.phone,p.birth,'', '']));exams.forEach(e=>rows.push(['Exame',e.name,patientName(e.patientId),e.date,e.status,e.price]));finance.forEach(f=>rows.push(['Financeiro',f.description,f.category,f.date,f.kind,f.amount]));let csv='\ufeff'+rows.map(r=>r.map(v=>'"'+String(v??'').replace(/"/g,'""')+'"').join(';')).join('\r\n');let url=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8;'})),a=document.createElement('a');a.href=url;a.download='relatorio-clinica.csv';a.click();URL.revokeObjectURL(url);toast('Relatório exportado.')}
render();
if('serviceWorker'in navigator && location.protocol.startsWith('http'))navigator.serviceWorker.register('./sw.js').catch(()=>{});

</script>
</body></html>
