<!DOCTYPE html>
<html lang="pt-BR" class="h-full bg-slate-50">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>VetExames - Novo Agendamento</title>
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <link rel="apple-touch-icon" href="Prancheta 4.png">
    <link rel="icon" type="image/png" href="Prancheta 4.png">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: {
                            teal: '#1F5B5C',
                            tealDark: '#153E3F',
                            tealLight: '#E8F2F2',
                            peach: '#F09B83',
                            peachDark: '#D97E66',
                            peachLight: '#FDF0EC',
                            bg: '#FAF9F6'
                        }
                    },
                    fontFamily: { sans: ['Inter', 'sans-serif'] }
                }
            }
        }
    </script>
</head>
<body class="bg-brand-bg text-slate-800 antialiased h-full flex flex-col pb-24">

    <!-- CABEÇALHO -->
    <header class="bg-white border-b border-slate-200/80 sticky top-0 z-30 shadow-sm">
        <div class="max-w-md mx-auto md:max-w-2xl px-4 py-3 flex items-center justify-between">
            <a href="agendamentos.html" class="w-9 h-9 rounded-full bg-slate-100 flex items-center justify-center text-slate-600 hover:bg-slate-200 transition">
                <i class="fa-solid fa-arrow-left"></i>
            </a>
            <div class="text-center">
                <h1 class="font-bold text-base text-slate-800">Novo Agendamento</h1>
                <p class="text-[11px] text-slate-500">Marcar Exame do Paciente</p>
            </div>
            <div class="w-9 h-9 rounded-xl bg-brand-tealLight flex items-center justify-center p-1 border border-brand-teal/10 shadow-sm overflow-hidden">
                <img src="Prancheta 4.png" alt="VetExames Logo" class="w-full h-full object-contain" onerror="this.onerror=null; this.parentElement.innerHTML='<i class=\'fa-solid fa-calendar-plus text-brand-teal text-lg\'></i>';">
            </div>
        </div>
    </header>

    <!-- CONTEÚDO DO FORMULÁRIO -->
    <main class="max-w-md mx-auto md:max-w-2xl px-4 pt-4 flex-1 w-full">
        <form id="form-agendamento" onsubmit="salvarAgendamento(event)" class="space-y-4">

            <!-- SEÇÃO 1: DATAS E EXAME -->
            <div class="bg-white p-4 rounded-2xl border border-slate-200/90 shadow-sm space-y-3">
                <h2 class="text-xs font-bold text-brand-teal uppercase tracking-wider flex items-center gap-1.5 border-b border-slate-100 pb-2">
                    <i class="fa-solid fa-calendar-check"></i> Dados do Agendamento
                </h2>

                <div class="grid grid-cols-1 md:grid-cols-2 gap-3">
                    <div>
                        <label class="block text-xs font-semibold text-slate-700 mb-1">Data e Hora do Exame *</label>
                        <input type="datetime-local" id="dataExame" required class="w-full text-xs p-2.5 rounded-xl border border-slate-200 bg-slate-50 focus:outline-none focus:border-brand-teal">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-700 mb-1">Tipo do Exame *</label>
                        <select id="tipoExame" required class="w-full text-xs p-2.5 rounded-xl border border-slate-200 bg-slate-50 focus:outline-none focus:border-brand-teal" onchange="verificarOutroExame(this)">
                            <option value="">Selecione o Exame</option>
                            <option value="Ultrassonografia abdominal">Ultrassonografia abdominal</option>
                            <option value="Raio x">Raio x</option>
                            <option value="Eletrocardiograma">Eletrocardiograma</option>
                            <option value="Endoscopia">Endoscopia</option>
                            <option value="Colonoscopia">Colonoscopia</option>
                            <option value="Outro">Outro (Especificar)</option>
                        </select>
                        <input type="text" id="outroExameInput" placeholder="Digite o nome do exame" class="w-full text-xs p-2.5 rounded-xl border border-slate-200 bg-slate-50 focus:outline-none focus:border-brand-teal mt-2 hidden">
                    </div>
                </div>
            </div>

            <!-- SEÇÃO 2: PACIENTE & TUTOR -->
            <div class="bg-white p-4 rounded-2xl border border-slate-200/90 shadow-sm space-y-3">
                <h2 class="text-xs font-bold text-brand-teal uppercase tracking-wider flex items-center gap-1.5 border-b border-slate-100 pb-2">
                    <i class="fa-solid fa-paw"></i> Paciente & Tutor
                </h2>

                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="block text-xs font-semibold text-slate-700 mb-1">Nome do Paciente *</label>
                        <input type="text" id="nome" placeholder="Ex: Thor" required class="w-full text-xs p-2.5 rounded-xl border border-slate-200 bg-slate-50 focus:outline-none focus:border-brand-teal">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-700 mb-1">Espécie *</label>
                        <select id="especie" required class="w-full text-xs p-2.5 rounded-xl border border-slate-200 bg-slate-50 focus:outline-none focus:border-brand-teal">
                            <option value="">Selecione</option>
                            <option value="Cão">Canina (Cão)</option>
                            <option value="Gato">Felina (Gato)</option>
                            <option value="Silvestre">Silvestre</option>
                            <option value="Outro">Outro</option>
                        </select>
                    </div>
                </div>

                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="block text-xs font-semibold text-slate-700 mb-1">Raça</label>
                        <input type="text" id="raca" placeholder="Ex: Golden Retriever" class="w-full text-xs p-2.5 rounded-xl border border-slate-200 bg-slate-50 focus:outline-none focus:border-brand-teal">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-700 mb-1">Nome do Tutor *</label>
                        <input type="text" id="tutor" placeholder="Ex: Maria Silva" required class="w-full text-xs p-2.5 rounded-xl border border-slate-200 bg-slate-50 focus:outline-none focus:border-brand-teal">
                    </div>
                </div>

                <div>
                    <label class="block text-xs font-semibold text-slate-700 mb-1">Telefone do Tutor (WhatsApp)</label>
                    <input type="tel" id="telefoneTutor" placeholder="(84) 99999-9999" class="w-full text-xs p-2.5 rounded-xl border border-slate-200 bg-slate-50 focus:outline-none focus:border-brand-teal">
                </div>
            </div>

            <!-- SEÇÃO 3: CLÍNICA & VETERINÁRIO SOLICITANTE -->
            <div class="bg-white p-4 rounded-2xl border border-slate-200/90 shadow-sm space-y-3">
                <h2 class="text-xs font-bold text-brand-teal uppercase tracking-wider flex items-center gap-1.5 border-b border-slate-100 pb-2">
                    <i class="fa-solid fa-user-doctor"></i> Origem / Solicitante
                </h2>

                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="block text-xs font-semibold text-slate-700 mb-1">Clínica</label>
                        <input type="text" id="clinica" placeholder="Ex: VetClinic" class="w-full text-xs p-2.5 rounded-xl border border-slate-200 bg-slate-50 focus:outline-none focus:border-brand-teal">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-700 mb-1">Estado (UF) *</label>
                        <select id="estado" required class="w-full text-xs p-2.5 rounded-xl border border-slate-200 bg-slate-50 focus:outline-none focus:border-brand-teal" onchange="carregarCidades(this.value)">
                            <option value="">Selecione o Estado</option>
                        </select>
                    </div>
                </div>

                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="block text-xs font-semibold text-slate-700 mb-1">Cidade *</label>
                        <select id="cidade" required class="w-full text-xs p-2.5 rounded-xl border border-slate-200 bg-slate-50 focus:outline-none focus:border-brand-teal" disabled>
                            <option value="">Selecione o Estado primeiro</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-700 mb-1">Vet. Solicitante</label>
                        <input type="text" id="veterinario" placeholder="Ex: Dr. Carlos" class="w-full text-xs p-2.5 rounded-xl border border-slate-200 bg-slate-50 focus:outline-none focus:border-brand-teal">
                    </div>
                </div>

                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="block text-xs font-semibold text-slate-700 mb-1">CRMV</label>
                        <input type="text" id="crmv" placeholder="Ex: 1234/RN" class="w-full text-xs p-2.5 rounded-xl border border-slate-200 bg-slate-50 focus:outline-none focus:border-brand-teal">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-700 mb-1">Telefone do Veterinário</label>
                        <input type="tel" id="telefoneVeterinario" placeholder="(84) 98888-8888" class="w-full text-xs p-2.5 rounded-xl border border-slate-200 bg-slate-50 focus:outline-none focus:border-brand-teal">
                    </div>
                </div>
            </div>

            <!-- SEÇÃO 4: OBSERVAÇÕES -->
            <div class="bg-white p-4 rounded-2xl border border-slate-200/90 shadow-sm space-y-3">
                <label class="block text-xs font-semibold text-slate-700">Anotações / Instruções pré-exame</label>
                <textarea id="anotacoes" rows="3" placeholder="Ex: Jejum de 8 horas necessário. Animal bravo." class="w-full text-xs p-2.5 rounded-xl border border-slate-200 bg-slate-50 focus:outline-none focus:border-brand-teal"></textarea>
            </div>

            <!-- BOTÃO REDONDO FLUTUANTE DE SALVAR (DISQUETE) -->
            <button type="submit" id="btn-submit" title="Salvar Agendamento" class="fixed bottom-6 right-6 w-14 h-14 bg-brand-teal text-white rounded-full shadow-2xl hover:bg-brand-tealDark active:scale-95 transition-all duration-200 flex items-center justify-center z-50 border-2 border-white/30 focus:outline-none">
                <i class="fa-solid fa-floppy-disk text-xl"></i>
            </button>
        </form>
    </main>

    <script>
        const GOOGLE_APP_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzr4B_rxUSJWfSCmS1rgSsJc7uOsKhicOAB6w4fU-skFD1A0XIaowv2rLgWAtjIahIW6w/exec";

        // Carregar Estados e Cidades via API do IBGE
        async function carregarEstados() {
            const selectEstado = document.getElementById('estado');
            try {
                const response = await fetch('https://servicodados.ibge.gov.br/api/v1/localidades/estados?orderBy=nome');
                const estados = await response.json();
                estados.forEach(est => {
                    const opt = document.createElement('option');
                    opt.value = est.sigla;
                    opt.textContent = est.nome;
                    selectEstado.appendChild(opt);
                });
                selectEstado.value = 'RN'; // Padrão Rio Grande do Norte
                carregarCidades('RN');
            } catch (error) {
                console.error('Erro ao carregar estados:', error);
            }
        }

        async function carregarCidades(uf) {
            const selectCidade = document.getElementById('cidade');
            selectCidade.innerHTML = '<option value="">Carregando...</option>';
            selectCidade.disabled = true;
            if (!uf) return;

            try {
                const response = await fetch(`https://servicodados.ibge.gov.br/api/v1/localidades/estados/${uf}/municipios?orderBy=nome`);
                const cidades = await response.json();
                selectCidade.innerHTML = '<option value="">Selecione a Cidade</option>';
                cidades.forEach(cid => {
                    const opt = document.createElement('option');
                    opt.value = cid.nome;
                    opt.textContent = cid.nome;
                    selectCidade.appendChild(opt);
                });
                selectCidade.disabled = false;
                selectCidade.value = 'Caicó'; // Padrão Caicó
            } catch (error) {
                console.error('Erro ao carregar cidades:', error);
                selectCidade.innerHTML = '<option value="">Erro ao carregar</option>';
            }
        }

        function verificarOutroExame(select) {
            const inputOutro = document.getElementById('outroExameInput');
            if (select.value === 'Outro') {
                inputOutro.classList.remove('hidden');
                inputOutro.required = true;
            } else {
                inputOutro.classList.add('hidden');
                inputOutro.required = false;
                inputOutro.value = '';
            }
        }

        function formatarDataFormatada(valorInputDateTime) {
            if (!valorInputDateTime) return '';
            const [data, hora] = valorInputDateTime.split('T');
            const [ano, mes, dia] = data.split('-');
            return `${dia}/${mes}/${ano} ${hora || ''}`;
        }

        async function salvarAgendamento(e) {
            e.preventDefault();
            const btn = document.getElementById('btn-submit');
            btn.disabled = true;
            btn.innerHTML = `<i class="fa-solid fa-spinner fa-spin text-xl"></i>`;

            const rawData = document.getElementById('dataExame').value;
            let tipoExameSelecionado = document.getElementById('tipoExame').value;
            if (tipoExameSelecionado === 'Outro') {
                tipoExameSelecionado = document.getElementById('outroExameInput').value;
            }

            const payload = {
                nome: document.getElementById('nome').value,
                tutor: document.getElementById('tutor').value,
                cidade: document.getElementById('cidade').value,
                estado: document.getElementById('estado').value,
                clinica: document.getElementById('clinica').value,
                especie: document.getElementById('especie').value,
                raca: document.getElementById('raca').value,
                veterinario: document.getElementById('veterinario').value,
                crmv: document.getElementById('crmv').value,
                dataExame: formatarDataFormatada(rawData),
                telefoneTutor: document.getElementById('telefoneTutor').value,
                telefoneVeterinario: document.getElementById('telefoneVeterinario').value,
                tipoExame: tipoExameSelecionado,
                anotacoes: document.getElementById('anotacoes').value
            };

            try {
                await fetch(GOOGLE_APP_SCRIPT_URL, {
                    method: 'POST',
                    mode: 'no-cors',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                alert('Agendamento realizado com sucesso!');
                window.location.href = 'agendamentos.html';
            } catch (err) {
                console.error(err);
                alert('Erro ao realizar agendamento. Verifique sua conexão.');
                btn.disabled = false;
                btn.innerHTML = `<i class="fa-solid fa-floppy-disk text-xl"></i>`;
            }
        }

        // Inicialização
        window.addEventListener('DOMContentLoaded', () => {
            carregarEstados();
        });
    </script>
</body>
</html>
