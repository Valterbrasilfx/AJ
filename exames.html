<!DOCTYPE html>

    <meta name="apple-mobile-web-app-title" content="VetExames">

    <!-- Tailwind CSS -->

    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: {
                            teal: '#1F5B5C',
                            tealDark: '#153E3F',

                            peachLight: '#FDF0EC',

                        }
                    },
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],

    <style>
        body {
            font-family: 'Inter', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: #f1f1f1;
        }
        ::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 4px;
        }
    </style>
</head>
<body class="bg-brand-bg text-slate-800 antialiased h-full flex flex-col pb-28 md:pb-20">

    <!-- HEADER TOP -->
    <header class="bg-white border-b border-slate-200/80 sticky top-0 z-30 shadow-sm">
        <div class="max-w-md mx-auto md:max-w-2xl px-4 py-3 flex items-center justify-between">
            <a href="index.html" class="w-9 h-9 rounded-full bg-slate-100 flex items-center justify-center text-slate-600 hover:bg-slate-200 transition">
                <i class="fa-solid fa-arrow-left"></i>
            </a>
            <div class="text-center">
                <h1 class="font-bold text-base text-slate-800">Lista de Exames</h1>
                <p class="text-[11px] text-slate-500">Histórico e Status de Pagamento</p>
            </div>
            <div class="w-9 h-9 rounded-xl bg-brand-tealLight flex items-center justify-center p-1 border border-brand-teal/10 shadow-sm overflow-hidden">
                <img src="Prancheta 4.png" alt="VetExames Logo" class="w-full h-full object-contain" onerror="this.onerror=null; this.parentElement.innerHTML='<i class=\'fa-solid fa-paw text-brand-teal text-xl\'></i>';">
            </div>
        </div>
    </header>

    <!-- BARRA DE BUSCA E FILTROS -->
    <main class="max-w-md mx-auto md:max-w-2xl px-4 pt-4 flex-1 w-full space-y-4">
        
        <div class="relative">
            <i class="fa-solid fa-magnifying-glass absolute left-3.5 top-1/2 -translate-y-1/2 text-slate-400 text-sm"></i>
            <input type="text" id="input-busca" oninput="filtrarExames()" placeholder="Buscar por pet, tutor ou veterinário..." class="w-full pl-10 pr-4 py-2.5 text-sm rounded-xl border border-slate-200 bg-white focus:outline-none focus:border-brand-teal shadow-sm">
        </div>

        <!-- LISTA DE CARDS DE EXAMES -->
        <div id="lista-exames" class="space-y-3">
            <!-- Loading inicial -->
            <div class="text-center py-12 text-slate-400">
                <div class="w-8 h-8 border-3 border-brand-teal border-t-transparent rounded-full animate-spin mx-auto mb-2"></div>
                <p class="text-xs">Carregando exames da planilha...</p>
            </div>
        </div>

    </main>

    <!-- BOTTOM MOBILE NAVIGATION BAR -->
    <nav class="fixed bottom-0 left-0 right-0 bg-white border-t border-slate-200/90 py-2 px-4 z-40 md:max-w-2xl md:mx-auto md:rounded-t-2xl md:shadow-lg">
        <div class="flex justify-around items-center max-w-md mx-auto">
            <a href="index.html" class="flex flex-col items-center text-slate-400 hover:text-brand-teal transition">
                <i class="fa-solid fa-house text-lg"></i>
                <span class="text-[10px] mt-0.5">Início</span>
            </a>
            <a href="exames.html" class="flex flex-col items-center text-brand-teal font-bold transition">
                <i class="fa-solid fa-notes-medical text-lg"></i>
                <span class="text-[10px] mt-0.5">Exames</span>
            </a>
            <a href="cadastro_exame.html" class="w-12 h-12 rounded-full bg-brand-teal text-white flex items-center justify-center text-xl shadow-lg hover:bg-brand-tealDark transition -mt-5 ring-4 ring-slate-50">
                <i class="fa-solid fa-plus"></i>
            </a>
            <a href="pacientes.html" class="flex flex-col items-center text-slate-400 hover:text-brand-teal transition">
                <i class="fa-solid fa-paw text-lg"></i>
                <span class="text-[10px] mt-0.5">Pacientes</span>
            </a>
            <a href="financeiro.html" class="flex flex-col items-center text-slate-400 hover:text-brand-teal transition">
                <i class="fa-solid fa-chart-line text-lg"></i>
                <span class="text-[10px] mt-0.5">Financeiro</span>
            </a>
        </div>
    </nav>

    <!-- MODAL DE FICHA COMPLETA DO EXAME -->
    <div id="modal-detalhes" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 flex items-end sm:items-center justify-center p-0 sm:p-4 opacity-0 pointer-events-none transition-all duration-300">
        <div class="bg-white w-full max-w-md sm:max-w-lg rounded-t-3xl sm:rounded-3xl max-h-[90vh] overflow-y-auto shadow-2xl flex flex-col">
            
            <!-- CABEÇALHO DO MODAL -->
            <div class="sticky top-0 bg-white px-5 py-4 border-b border-slate-100 flex items-center justify-between z-10 shadow-xs">
                <div class="flex items-center gap-2">
                    <div class="w-8 h-8 rounded-full bg-brand-tealLight flex items-center justify-center text-brand-teal text-sm">
                        <i class="fa-solid fa-file-invoice"></i>
                    </div>
                    <h2 class="font-bold text-slate-800 text-base">Ficha do Exame</h2>
                </div>
                <button onclick="fecharModal()" class="w-8 h-8 rounded-full bg-slate-100 text-slate-500 flex items-center justify-center hover:bg-slate-200 transition">
                    <i class="fa-solid fa-xmark"></i>
                </button>
            </div>

            <!-- CONTEÚDO DO MODAL -->
            <div id="modal-conteudo" class="p-5 space-y-4 flex-1">
                <!-- Preenchido dinamicamente via JavaScript -->
            </div>

            <!-- RODAPÉ DO MODAL -->
            <div class="bg-slate-50 px-5 py-3 border-t border-slate-100 flex items-center justify-end">
                <button onclick="fecharModal()" class="bg-slate-200 hover:bg-slate-300 text-slate-700 font-semibold px-4 py-2 rounded-xl text-xs transition">
                    Fechar
                </button>
            </div>

        </div>
    </div>

    <!-- TOAST -->
    <div id="toast" class="fixed top-5 left-1/2 -translate-x-1/2 bg-slate-800 text-white text-xs px-4 py-2.5 rounded-xl shadow-xl z-50 transition-all duration-300 opacity-0 pointer-events-none flex items-center gap-2">
        <i class="fa-solid fa-circle-info text-brand-peach"></i>
        <span id="toast-msg">Mensagem</span>
    </div>

    <!-- JAVASCRIPT -->
    <script>
        const GOOGLE_APP_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxaOy6vRmz_rU6OYTJ46YrPsq4-NpPQ_sromqDMA7jKZWpij1lkiSc5jQGvDr6G20k/exec";

        let todosExames = [];
        let examesFiltrados = [];

        function parseValor(strValor) {
            if (!strValor) return 0;
            if (typeof strValor === 'number') return strValor;
            let limpo = strValor.toString().replace(/[^\d,.-]/g, '');
            if (limpo.includes(',') && limpo.includes('.')) {
                limpo = limpo.replace(/\./g, '').replace(',', '.');
            } else if (limpo.includes(',')) {
                limpo = limpo.replace(',', '.');
            }
            const num = parseFloat(limpo);
            return isNaN(num) ? 0 : num;
        }

        function formatarMoeda(num) {
            return 'R$ ' + num.toFixed(2).replace('.', ',').replace(/(\d)(?=(\d{3})+(?!\d))/g, '$1.');
        }

        function converterLinkDrive(url) {
            if (!url) return '';
            url = url.trim();
            let fileId = '';
            if (url.includes('/d/')) {
                const parts = url.split('/d/');
                if (parts[1]) fileId = parts[1].split('/')[0].split('?')[0];
            } else if (url.includes('id=')) {
                const match = url.match(/id=([^&]+)/);
                if (match && match[1]) fileId = match[1];
            }
            return fileId ? `https://drive.google.com/thumbnail?id=${fileId}&sz=s1000` : url;
        }

        function escaparHtml(str) {
            if (str === null || str === undefined) return '';
            return String(str)
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#039;");
        }

        window.addEventListener('DOMContentLoaded', () => {
            carregarExames();
        });

        async function carregarExames() {
            const container = document.getElementById('lista-exames');
            try {
                const res = await fetch(GOOGLE_APP_SCRIPT_URL);
                const exames = await res.json();
                
                // Mapeamento limpo
                todosExames = exames.reverse();
                examesFiltrados = [...todosExames];

                renderizarExames(examesFiltrados);
            } catch (err) {
                console.error("Erro ao carregar exames:", err);
                container.innerHTML = `
                    <div class="text-center py-8 text-red-500 text-xs">
                        <i class="fa-solid fa-circle-exclamation text-xl mb-1"></i>
                        <p>Erro ao carregar exames da planilha.</p>
                    </div>
                `;
            }
        }

        function renderizarExames(lista) {
            const container = document.getElementById('lista-exames');

            if (!lista || lista.length === 0) {
                container.innerHTML = `
                    <div class="text-center py-12 text-slate-400">
                        <i class="fa-solid fa-folder-open text-3xl mb-2"></i>
                        <p class="text-xs">Nenhum exame encontrado.</p>
                    </div>
                `;
                return;
            }

            container.innerHTML = lista.map((item, index) => {
                const isPago = (item.statusPagamento || '').toString().trim().toUpperCase() === 'PAGO';
                
                const val1 = parseValor(item.valor);
                const val2 = parseValor(item.valor2);
                const val3 = parseValor(item.valor3);
                const valorTotal = val1 + val2 + val3;

                const badgeStatus = isPago ? `
                    <span class="inline-flex items-center gap-1 bg-emerald-50 text-emerald-700 text-[11px] font-bold px-2.5 py-1 rounded-full border border-emerald-200">
                        <i class="fa-solid fa-circle-check text-[10px]"></i> PAGO
                    </span>
                ` : `
                    <span class="inline-flex items-center gap-1 bg-amber-50 text-amber-700 text-[11px] font-bold px-2.5 py-1 rounded-full border border-amber-200">
                        <i class="fa-solid fa-clock text-[10px]"></i> PENDENTE
                    </span>
                `;

                const fotoDirect = converterLinkDrive(item.foto);
                const fotoHtml = fotoDirect ? `
                    <div class="w-12 h-12 rounded-xl bg-slate-100 overflow-hidden border border-slate-200 flex-shrink-0">
                        <img src="${fotoDirect}" alt="${escaparHtml(item.nome)}" class="w-full h-full object-cover" onerror="this.onerror=null; this.parentElement.innerHTML='<div class=\'w-full h-full bg-brand-tealLight text-brand-teal flex items-center justify-center font-bold text-sm\'><i class=\'fa-solid fa-paw\'></i></div>';">
                    </div>
                ` : `
                    <div class="w-12 h-12 rounded-xl bg-brand-tealLight text-brand-teal flex items-center justify-center font-bold text-lg flex-shrink-0">
                        <i class="fa-solid fa-paw"></i>
                    </div>
                `;

                let examesRealizadosHtml = `<span class="text-brand-teal font-semibold">${escaparHtml(item.tipoExame) || 'Exame não especificado'}</span>`;
                if (item.tipoExame2) {
                    examesRealizadosHtml += `<br><span class="text-slate-600">${escaparHtml(item.tipoExame2)}</span>`;
                }
                if (item.tipoExame3) {
                    examesRealizadosHtml += `<br><span class="text-slate-600">${escaparHtml(item.tipoExame3)}</span>`;
                }

                // Linha da planilha para acionar o update do status (ou índice alternativo)
                const rowParaAtualizar = item.rowIndex ? item.rowIndex : (todosExames.length - index + 1);

                return `
                    <div onclick="abrirModalPorIndice(${index})" class="bg-white rounded-2xl p-4 border border-slate-200/90 shadow-sm space-y-3 cursor-pointer hover:border-brand-teal/50 hover:shadow-md transition active:scale-[0.99]">
                        <div class="flex items-start justify-between gap-2">
                            <div class="flex items-center gap-3">
                                ${fotoHtml}
                                <div>
                                    <h3 class="font-bold text-slate-800 text-sm leading-tight">${escaparHtml(item.nome) || 'Sem Nome'}</h3>
                                    <div class="text-xs mt-0.5">${examesRealizadosHtml}</div>
                                </div>
                            </div>
                            <div>
                                ${badgeStatus}
                            </div>
                        </div>

                        <div class="grid grid-cols-2 gap-2 pt-2 border-t border-slate-100 text-xs">
                            <div>
                                <span class="text-slate-400 block text-[10px]">TUTOR</span>
                                <span class="font-semibold text-slate-700">${escaparHtml(item.tutor) || '-'}</span>
                            </div>
                            <div>
                                <span class="text-slate-400 block text-[10px]">VETERINÁRIO</span>
                                <span class="font-semibold text-slate-700">${escaparHtml(item.veterinario) || '-'}</span>
                            </div>
                        </div>

                        <div class="flex items-center justify-between pt-1">
                            <div>
                                <span class="text-[10px] text-slate-400 uppercase font-bold block">Valor Total</span>
                                <span class="text-sm font-extrabold text-slate-800">${formatarMoeda(valorTotal)}</span>
                            </div>
                            <button onclick="event.stopPropagation(); alternarStatusPagamento(${rowParaAtualizar}, '${isPago ? '' : 'PAGO'}')" class="text-xs font-semibold px-3 py-1.5 rounded-xl border ${isPago ? 'border-slate-200 text-slate-600 hover:bg-slate-50' : 'bg-emerald-600 text-white hover:bg-emerald-700'} transition flex items-center gap-1.5">
                                <i class="fa-solid ${isPago ? 'fa-rotate-left' : 'fa-check'}"></i>
                                <span>${isPago ? 'Marcar Pendente' : 'Marcar como Pago'}</span>
                            </button>
                        </div>
                    </div>
                `;
            }).join('');
        }

        function abrirModalPorIndice(index) {
            const item = examesFiltrados[index];
            if (!item) return;

            const isPago = (item.statusPagamento || '').toString().trim().toUpperCase() === 'PAGO';
            const modal = document.getElementById('modal-detalhes');
            const conteudo = document.getElementById('modal-conteudo');

            const val1 = parseValor(item.valor);
            const val2 = parseValor(item.valor2);
            const val3 = parseValor(item.valor3);
            const valorTotal = val1 + val2 + val3;

            const fotoDirect = converterLinkDrive(item.foto);
            const fotoModal = fotoDirect ? `
                <div class="relative w-full h-52 rounded-2xl bg-slate-100 overflow-hidden border border-slate-200 mb-3 shadow-inner flex items-center justify-center">
                    <img src="${fotoDirect}" alt="${escaparHtml(item.nome)}" class="w-full h-full object-cover" onerror="this.parentElement.innerHTML='<div class=\'flex flex-col items-center justify-center h-full text-xs text-slate-400 gap-2 p-4 text-center\'><i class=\'fa-solid fa-circle-exclamation text-amber-500 text-lg\'></i><span>Não foi possível carregar a imagem. Verifique se a pasta no Drive está compartilhada como pública ("Qualquer pessoa com o link").</span></div>';">
                    <a href="${item.foto}" target="_blank" class="absolute bottom-2 right-2 bg-slate-900/80 text-white text-xs px-3 py-1.5 rounded-xl flex items-center gap-1.5 backdrop-blur-sm hover:bg-slate-900 transition shadow">
                        <i class="fa-solid fa-up-right-from-square"></i> Abrir Original
                    </a>
                </div>
            ` : '';

            conteudo.innerHTML = `
                ${fotoModal}

                <!-- VALOR TOTAL E STATUS -->
                <div class="bg-slate-50 p-3.5 rounded-2xl border border-slate-200/80 flex items-center justify-between">
                    <div>
                        <span class="text-[10px] text-slate-400 uppercase font-bold block">Valor Total</span>
                        <span class="text-xl font-extrabold text-slate-800">${formatarMoeda(valorTotal)}</span>
                    </div>
                    <div class="text-right">
                        <span class="text-[10px] text-slate-400 uppercase font-bold block mb-1">Status de Pagamento</span>
                        ${isPago ? `
                            <span class="inline-flex items-center gap-1 bg-emerald-100 text-emerald-800 text-xs font-bold px-3 py-1 rounded-full border border-emerald-300">
                                <i class="fa-solid fa-circle-check"></i> PAGO
                            </span>
                        ` : `
                            <span class="inline-flex items-center gap-1 bg-amber-100 text-amber-800 text-xs font-bold px-3 py-1 rounded-full border border-amber-300">
                                <i class="fa-solid fa-clock"></i> PENDENTE
                            </span>
                        `}
                    </div>
                </div>

                <!-- PACIENTE -->
                <div class="bg-white p-3.5 rounded-2xl border border-slate-200/80 space-y-2">
                    <h4 class="text-xs font-bold text-brand-teal uppercase tracking-wider flex items-center gap-1.5">
                        <i class="fa-solid fa-paw"></i> Dados do Paciente
                    </h4>
                    <div class="grid grid-cols-2 gap-2 text-xs">
                        <div><span class="text-slate-400 block text-[10px]">NOME</span><span class="font-bold text-slate-800">${escaparHtml(item.nome) || '-'}</span></div>
                        <div><span class="text-slate-400 block text-[10px]">ESPÉCIE / RAÇA</span><span class="font-semibold text-slate-700">${escaparHtml(item.especie) || '-'}${item.raca ? ' (' + escaparHtml(item.raca) + ')' : ''}</span></div>
                        <div><span class="text-slate-400 block text-[10px]">IDADE</span><span class="font-semibold text-slate-700">${escaparHtml(item.idade) || '-'}</span></div>
                        <div><span class="text-slate-400 block text-[10px]">PESO / CASTRADO</span><span class="font-semibold text-slate-700">${item.peso ? item.peso + ' kg' : '-'}${item.castrado ? ' • ' + item.castrado : ''}</span></div>
                    </div>
                </div>

                <!-- TUTOR -->
                <div class="bg-white p-3.5 rounded-2xl border border-slate-200/80 space-y-2">
                    <h4 class="text-xs font-bold text-brand-teal uppercase tracking-wider flex items-center gap-1.5">
                        <i class="fa-solid fa-user"></i> Dados do Tutor
                    </h4>
                    <div class="grid grid-cols-2 gap-2 text-xs">
                        <div><span class="text-slate-400 block text-[10px]">TUTOR</span><span class="font-bold text-slate-800">${escaparHtml(item.tutor) || '-'}</span></div>
                        <div>
                            <span class="text-slate-400 block text-[10px]">TELEFONE</span>
                            <span class="font-semibold text-slate-700">${escaparHtml(item.telefoneTutor) || '-'}</span>
                            ${item.telefoneTutor ? `
                                <a href="https://wa.me/55${String(item.telefoneTutor).replace(/\D/g, '')}" target="_blank" class="inline-flex items-center gap-1 text-[10px] text-emerald-600 font-bold ml-1 hover:underline">
                                    <i class="fa-brands fa-whatsapp"></i> WhatsApp
                                </a>
                            ` : ''}
                        </div>
                        <div class="col-span-2"><span class="text-slate-400 block text-[10px]">CIDADE / UF</span><span class="font-semibold text-slate-700">${escaparHtml(item.cidadeUf) || '-'}</span></div>
                    </div>
                </div>

                <!-- VETERINÁRIO & CLÍNICA -->
                <div class="bg-white p-3.5 rounded-2xl border border-slate-200/80 space-y-2">
                    <h4 class="text-xs font-bold text-brand-teal uppercase tracking-wider flex items-center gap-1.5">
                        <i class="fa-solid fa-user-doctor"></i> Solicitante / Clínica
                    </h4>
                    <div class="grid grid-cols-2 gap-2 text-xs">
                        <div><span class="text-slate-400 block text-[10px]">CLÍNICA</span><span class="font-bold text-slate-800">${escaparHtml(item.clinica) || '-'}</span></div>
                        <div><span class="text-slate-400 block text-[10px]">VETERINÁRIO(A)</span><span class="font-semibold text-slate-700">${escaparHtml(item.veterinario) || '-'}${item.crmv ? ' (' + escaparHtml(item.crmv) + ')' : ''}</span></div>
                        <div class="col-span-2">
                            <span class="text-slate-400 block text-[10px]">TELEFONE VET</span>
                            <span class="font-semibold text-slate-700">${escaparHtml(item.telefoneVet) || '-'}</span>
                            ${item.telefoneVet ? `
                                <a href="https://wa.me/55${String(item.telefoneVet).replace(/\D/g, '')}" target="_blank" class="inline-flex items-center gap-1 text-[10px] text-emerald-600 font-bold ml-1 hover:underline">
                                    <i class="fa-brands fa-whatsapp"></i> WhatsApp
                                </a>
                            ` : ''}
                        </div>
                    </div>
                </div>

                <!-- EXAMES REALIZADOS -->
                <div class="bg-white p-3.5 rounded-2xl border border-slate-200/80 space-y-2">
                    <h4 class="text-xs font-bold text-brand-teal uppercase tracking-wider flex items-center gap-1.5">
                        <i class="fa-solid fa-notes-medical"></i> Exames Realizados
                    </h4>
                    <div class="space-y-2 text-xs">
                        <div class="flex justify-between items-center border-b border-slate-100 pb-1.5">
                            <div><span class="text-slate-400 block text-[10px]">EXAME 1</span><span class="font-bold text-brand-teal">${escaparHtml(item.tipoExame) || '-'}</span></div>
                            <span class="font-bold text-slate-800">${item.valor || 'R$ 0,00'}</span>
                        </div>
                        ${item.tipoExame2 ? `
                        <div class="flex justify-between items-center border-b border-slate-100 pb-1.5">
                            <div><span class="text-slate-400 block text-[10px]">EXAME 2</span><span class="font-bold text-brand-teal">${escaparHtml(item.tipoExame2)}</span></div>
                            <span class="font-bold text-slate-800">${item.valor2 || 'R$ 0,00'}</span>
                        </div>` : ''}
                        ${item.tipoExame3 ? `
                        <div class="flex justify-between items-center pb-1">
                            <div><span class="text-slate-400 block text-[10px]">EXAME 3</span><span class="font-bold text-brand-teal">${escaparHtml(item.tipoExame3)}</span></div>
                            <span class="font-bold text-slate-800">${item.valor3 || 'R$ 0,00'}</span>
                        </div>` : ''}
                        <div class="pt-1 border-t border-slate-100 flex justify-between items-center">
                            <span class="text-slate-400 text-[10px]">DATA DO EXAME</span>
                            <span class="font-semibold text-slate-700">${item.dataExame || '-'}</span>
                        </div>
                    </div>
                </div>

                <!-- INFORMAÇÕES CLÍNICAS (SUSPEITA E ANOTAÇÕES) -->
                ${(item.suspeitaClinica || item.anotacoes) ? `
                <div class="bg-white p-3.5 rounded-2xl border border-slate-200/80 space-y-2">
                    <h4 class="text-xs font-bold text-brand-teal uppercase tracking-wider flex items-center gap-1.5">
                        <i class="fa-solid fa-file-pen"></i> Informações Clínicas
                    </h4>
                    <div class="space-y-2 text-xs">
                        ${item.suspeitaClinica ? `<div><span class="text-slate-400 block text-[10px]">SUSPEITA CLÍNICA</span><span class="font-semibold text-slate-800">${escaparHtml(item.suspeitaClinica)}</span></div>` : ''}
                        ${item.anotacoes ? `<div><span class="text-slate-400 block text-[10px]">ANOTAÇÕES</span><span class="text-slate-700 whitespace-pre-wrap">${escaparHtml(item.anotacoes)}</span></div>` : ''}
                    </div>
                </div>
                ` : ''}
            `;

            modal.classList.remove('opacity-0', 'pointer-events-none');
        }

        function fecharModal() {
            document.getElementById('modal-detalhes').classList.add('opacity-0', 'pointer-events-none');
        }

        function filtrarExames() {
            const termo = document.getElementById('input-busca').value.toLowerCase();
            examesFiltrados = todosExames.filter(item => {
                return (item.nome || '').toLowerCase().includes(termo) ||
                       (item.tutor || '').toLowerCase().includes(termo) ||
                       (item.veterinario || '').toLowerCase().includes(termo) ||
                       (item.tipoExame || '').toLowerCase().includes(termo) ||
                       (item.tipoExame2 || '').toLowerCase().includes(termo) ||
                       (item.tipoExame3 || '').toLowerCase().includes(termo);
            });
            renderizarExames(examesFiltrados);
        }

        async function alternarStatusPagamento(rowIndex, novoStatus) {
            exibirToast("Atualizando status de pagamento...");
            try {
                await fetch(GOOGLE_APP_SCRIPT_URL, {
                    method: 'POST',
                    mode: 'no-cors',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        action: 'updatePaymentStatus',
                        rowIndex: rowIndex,
                        status: novoStatus
                    })
                });

                exibirToast(novoStatus === 'PAGO' ? "Pagamento confirmado!" : "Status alterado para Pendente");
                setTimeout(() => { carregarExames(); }, 1000);
            } catch (err) {
                console.error(err);
                alert("Erro ao alterar o status na planilha.");
            }
        }

        function exibirToast(mensagem) {
            const toast = document.getElementById('toast');
            document.getElementById('toast-msg').innerText = mensagem;
            toast.classList.remove('opacity-0', 'pointer-events-none');
            setTimeout(() => { toast.classList.add('opacity-0', 'pointer-events-none'); }, 2500);
        }
    </script>
</body>
</html>
